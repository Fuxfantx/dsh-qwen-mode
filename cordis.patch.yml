# The reply-only permission preset is maintained at runtime, after this plugin
# loads: `index.js` merges `qmode-reply-only` into the `permission` row without
# replacing the row's other presets. A patch config replaces the entry's config
# wholesale, so overriding `permission` here would freeze every stock preset at
# this package's version.
- insert:
    - id: qwen-mode
      name: 'dsh-qwen-mode'
      config: {}
